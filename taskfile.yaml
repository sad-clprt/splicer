version: "3"

includes:
  global:
    taskfile: ../../taskfile.yaml

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list-all

  logs:init:
    desc: "Initialize .logs/ directory and SQLite database"
    cmds:
      - task: global:logs:init

  logs:schema:
    desc: "Print log database schema as JSON"
    cmds:
      - task: global:logs:schema

  logs:query:
    desc: "Query logs with filters. Env vars: LEVEL, TEXT, SINCE, UNTIL, LIMIT, ORDER"
    cmds:
      - task: global:logs:query
